name: Graficos

on:
  schedule:
    # Cada hora: el cron de GitHub se salta corridas y las cifras quedaban viejas.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/banner.js", "scripts/racha.js", ".github/workflows/graficos.yml"]

permissions:
  contents: read

concurrency:
  group: graficos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      USUARIO: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Generar banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/banner.js "$USUARIO" "$RUNNER_TEMP/salida"
      - name: Generar racha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/racha.js "$USUARIO" "$RUNNER_TEMP/salida"
      - name: Generar grafico 3D
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Juntar los SVG
        run: |
          mkdir -p "$RUNNER_TEMP/salida/profile-3d-contrib"
          cp profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-night-green.svg "$RUNNER_TEMP/salida/profile-3d-contrib/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graficos
          path: ${{ runner.temp }}/salida
          retention-days: 1
          if-no-files-found: error

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graficos
          path: ${{ runner.temp }}/salida
      - name: Publicar en la rama salida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin salida >/dev/null; then
            git switch salida
          else
            git switch --orphan salida
          fi
          cp -r "$RUNNER_TEMP"/salida/. .
          git add cosecha.svg cosecha-oscuro.svg racha-es.svg racha-en.svg profile-3d-contrib
          if git diff --cached --quiet; then
            echo "sin cambios en los graficos"
          else
            git commit -q -m "chore: graficos del $(date -u +%F)"
            git push origin salida
          fi
