<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Cristian Muñoz, desarrollador junior full-stack: datos, API e interfaz. Busco prácticas.">
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.ceja{font-size:13px;font-weight:700;letter-spacing:2.6px;fill:#1a5fb4}
.n1{font-size:68px;font-weight:800;fill:#0b2a4a;letter-spacing:-2px}
.n2{font-size:68px;font-weight:800;letter-spacing:-2px;fill:url(#tinta);fill-opacity:0;stroke:#0b2a4a;stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;animation:trazo 2.2s .4s cubic-bezier(.65,0,.35,1) forwards,llena .8s 2.2s ease-out forwards}
@keyframes trazo{to{stroke-dashoffset:0}}@keyframes llena{to{fill-opacity:1}}
.frase{font-size:17px;fill:#3d4b5c}
.chip{font-size:13px;font-weight:600}
.capa{font-size:15px;font-weight:700;fill:#0b2a4a}.det{font-size:12px;fill:#57606a}
.aparece{opacity:0;animation:aparece .7s cubic-bezier(.2,.8,.2,1) forwards}@keyframes aparece{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.barra{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:barra .9s .2s cubic-bezier(.2,.8,.2,1) forwards}@keyframes barra{to{transform:scaleX(1)}}
.cae{opacity:0;animation:cae .9s cubic-bezier(.2,1.3,.4,1) forwards}@keyframes cae{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:translateY(0)}}
.flota{animation:flota 4s ease-in-out infinite alternate}@keyframes flota{to{transform:translateY(-6px)}}
.dato{animation:dato 2.5s ease-in-out infinite}@keyframes dato{0%,100%{fill-opacity:.35}50%{fill-opacity:1}}
.ruta{transform-box:fill-box;transform-origin:left;animation:ruta 2.4s ease-in-out infinite}@keyframes ruta{0%,100%{transform:scaleX(.4)}50%{transform:scaleX(1)}}
.bloque{animation:dato 3s ease-in-out infinite}
.boton{animation:dato 1.4s ease-in-out infinite}
.sube{opacity:0;animation:sube 2.8s linear infinite}@keyframes sube{0%{opacity:0;transform:translateY(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-150px)}}
.late{transform-box:fill-box;transform-origin:center;animation:late 1.6s ease-out infinite}@keyframes late{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.halo{animation:halo 6s ease-in-out infinite alternate}@keyframes halo{to{transform:translate(-20px,10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important;fill-opacity:1!important}}
</style>
