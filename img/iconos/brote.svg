<path class="hoja izq" d="M20 15c-6 0-10-3-11-8 6 0 10 3 11 8z" fill="#2da44e"/>
<path class="hoja der" d="M21 12c1-5 5-8 11-8-1 5-5 8-11 8z" fill="#2da44e"/>
</svg>
