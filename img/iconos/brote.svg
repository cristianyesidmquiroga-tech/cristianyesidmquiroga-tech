<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Brote que crece">
<style>
.tallo{transform-box:fill-box;transform-origin:bottom center;animation:crecer 4s ease-out infinite}
@keyframes crecer{0%{transform:scaleY(0)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.hoja{transform-box:fill-box;animation:abrir 4s ease-out infinite}
.izq{transform-origin:right bottom}
.der{transform-origin:left bottom}
@keyframes abrir{0%,25%{transform:scale(0)}50%,85%{transform:scale(1)}100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
