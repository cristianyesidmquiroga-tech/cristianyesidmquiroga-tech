<line x1="288" y1="112" x2="400" y2="112" stroke="#9aa4b2"/>
<rect class="barra" style="animation-delay:0s" x="292" y="98" width="9" height="14" rx="2" fill="#3b82d6" opacity="0.5"/><rect class="barra" style="animation-delay:0.15s" x="307" y="90" width="9" height="22" rx="2" fill="#3b82d6" opacity="0.57"/><rect class="barra" style="animation-delay:0.3s" x="322" y="102" width="9" height="10" rx="2" fill="#3b82d6" opacity="0.64"/><rect class="barra" style="animation-delay:0.45s" x="337" y="84" width="9" height="28" rx="2" fill="#3b82d6" opacity="0.71"/><rect class="barra" style="animation-delay:0.6s" x="352" y="94" width="9" height="18" rx="2" fill="#3b82d6" opacity="0.78"/><rect class="barra" style="animation-delay:0.75s" x="367" y="88" width="9" height="24" rx="2" fill="#3b82d6" opacity="0.85"/><rect class="barra" style="animation-delay:0.9s" x="382" y="100" width="9" height="12" rx="2" fill="#3b82d6" opacity="0.92"/>
<circle cx="29" cy="37" r="4" fill="#3b82d6"/>
<text x="40" y="41" class="s">WEATHER MONITORING</text>
<text x="24" y="74" class="t">Nuestro Clima</text>
<text x="24" y="136" class="d">Weather stations, river alerts and NASA imagery:</text>
<text x="24" y="156" class="d">rain map and weekly report in PDF and Excel.</text>
<rect x="24" y="186" width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="53" y="203" text-anchor="middle" class="tag">Flask</text><rect x="90" y="186" width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="119" y="203" text-anchor="middle" class="tag">Redis</text><rect x="156" y="186" width="65.2" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="188.6" y="203" text-anchor="middle" class="tag">Docker</text>
