<line x1="24" y1="226" x2="396" y2="226" stroke="#30363d"/>
<circle class="late" cx="30" cy="246" r="4" fill="#2da44e"/><circle cx="30" cy="246" r="4" fill="#2da44e"/>
<text x="42" y="250" class="est">En línea</text>
<text x="374" y="250" text-anchor="end" class="acc">Ver sitio</text>
<path class="flecha" d="M380 246h12m-5-5 5 5-5 5" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
