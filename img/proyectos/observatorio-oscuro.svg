<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270" role="img" aria-label="Observatorio: Mapa, indicadores y datos abiertos de más de 5.500 productores en 69 municipios del Gran Santander.">
<style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.s{fill:#d9480f;font-size:11.5px;font-weight:700;letter-spacing:1.6px}.t{fill:#f0f6fc;font-size:24px;font-weight:800;letter-spacing:-.5px}.d{fill:#c9d1d9;font-size:13.5px}.tag{fill:#c9d1d9;font-size:12px;font-weight:600}
.est{fill:#c9d1d9;font-size:12px;font-weight:600}.acc{fill:#d9480f;font-size:12.5px;font-weight:700}
.luzBarra{animation:corre 3.6s linear infinite}@keyframes corre{from{transform:translateX(-140px)}to{transform:translateX(420px)}}
.late{transform-box:fill-box;transform-origin:center;animation:late 1.6s ease-out infinite}@keyframes late{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.flecha{animation:flecha 1.4s ease-in-out infinite}@keyframes flecha{50%{transform:translateX(4px)}}
.flota{animation:flota 3.2s ease-in-out infinite alternate}@keyframes flota{to{transform:translateY(-4px)}}
.llega{animation:llega 3.6s cubic-bezier(.2,.8,.2,1) infinite}@keyframes llega{0%{transform:translateX(40px);opacity:0}20%,80%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.marca{transform-box:fill-box;transform-origin:center;animation:marca 3.6s ease-out infinite}@keyframes marca{0%,8%{transform:scale(0)}18%{transform:scale(1.25)}24%,88%{transform:scale(1)}100%{transform:scale(0)}}
.carta{animation:carta 3.6s ease-out infinite}@keyframes carta{0%,60%{transform:translateY(10px);opacity:0}72%,92%{transform:translateY(0);opacity:1}100%{opacity:0}}
.escaner{animation:scan 1.8s ease-in-out infinite alternate}@keyframes scan{to{transform:translateY(46px)}}
.luz{animation:semaforo 3.6s steps(1) infinite}@keyframes semaforo{0%,49%{fill:#ff5f57}50%,100%{fill:#2da44e}}
.brazo{transform-origin:380px 70px;animation:abre 3.6s ease-in-out infinite}@keyframes abre{0%,48%{transform:rotate(0)}58%,90%{transform:rotate(-75deg)}100%{transform:rotate(0)}}
.sol{transform-origin:372px 36px;animation:gira 14s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.gota{animation:cae 1.1s linear infinite}@keyframes cae{from{transform:translateY(0);opacity:1}to{transform:translateY(20px);opacity:0}}
.barra,.crece{transform-box:fill-box;transform-origin:bottom;animation:sube 3s ease-in-out infinite}@keyframes sube{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pin{animation:salta 1.6s ease-in-out infinite}@keyframes salta{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#0d1726"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#d9480f" stop-opacity=".28"/><stop offset="1" stop-color="#d9480f" stop-opacity="0"/></radialGradient>
<linearGradient id="luz" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="marco"><rect width="420" height="270" rx="18"/></clipPath></defs>
<g clip-path="url(#marco)">
<rect width="420" height="270" fill="url(#fondo)"/>
<g stroke="#ffffff" stroke-opacity=".035"><line x1="0" y1="0" x2="0" y2="270"/><line x1="24" y1="0" x2="24" y2="270"/><line x1="48" y1="0" x2="48" y2="270"/><line x1="72" y1="0" x2="72" y2="270"/><line x1="96" y1="0" x2="96" y2="270"/><line x1="120" y1="0" x2="120" y2="270"/><line x1="144" y1="0" x2="144" y2="270"/><line x1="168" y1="0" x2="168" y2="270"/><line x1="192" y1="0" x2="192" y2="270"/><line x1="216" y1="0" x2="216" y2="270"/><line x1="240" y1="0" x2="240" y2="270"/><line x1="264" y1="0" x2="264" y2="270"/><line x1="288" y1="0" x2="288" y2="270"/><line x1="312" y1="0" x2="312" y2="270"/><line x1="336" y1="0" x2="336" y2="270"/><line x1="360" y1="0" x2="360" y2="270"/><line x1="384" y1="0" x2="384" y2="270"/><line x1="408" y1="0" x2="408" y2="270"/><line x1="0" y1="0" x2="420" y2="0"/><line x1="0" y1="24" x2="420" y2="24"/><line x1="0" y1="48" x2="420" y2="48"/><line x1="0" y1="72" x2="420" y2="72"/><line x1="0" y1="96" x2="420" y2="96"/><line x1="0" y1="120" x2="420" y2="120"/><line x1="0" y1="144" x2="420" y2="144"/><line x1="0" y1="168" x2="420" y2="168"/><line x1="0" y1="192" x2="420" y2="192"/><line x1="0" y1="216" x2="420" y2="216"/><line x1="0" y1="240" x2="420" y2="240"/><line x1="0" y1="264" x2="420" y2="264"/></g>
<circle cx="345" cy="68" r="95" fill="url(#halo)"/>
<rect width="420" height="5" fill="#d9480f"/><rect class="luzBarra" width="140" height="5" fill="url(#luz)"/>

<g class="flota"><polygon points="342,52 398,80 342,108 286,80" fill="#2da44e" opacity=".22" stroke="#2da44e" stroke-opacity=".5"/>
<path d="M314 66l56 28M328 59l56 28M314 94l56-28M328 101l56-28" stroke="#2da44e" stroke-opacity=".35"/>
<rect class="crece" x="318" y="66" width="8" height="18" rx="1.5" fill="#1a5fb4"/><rect class="crece" style="animation-delay:.3s" x="362" y="72" width="8" height="24" rx="1.5" fill="#2da44e"/><rect class="crece" style="animation-delay:.6s" x="340" y="82" width="8" height="12" rx="1.5" fill="#e3b341"/>
<g class="pin" style="animation-delay:0s"><path d="M300 70c-5-6-7-9-7-12a7 7 0 0 1 14 0c0 3-2 6-7 12z" fill="#d9480f"/><circle cx="300" cy="58" r="2.5" fill="#fff"/></g><g class="pin" style="animation-delay:0.5s"><path d="M352 58c-5-6-7-9-7-12a7 7 0 0 1 14 0c0 3-2 6-7 12z" fill="#d9480f"/><circle cx="352" cy="46" r="2.5" fill="#fff"/></g><g class="pin" style="animation-delay:1s"><path d="M378 86c-5-6-7-9-7-12a7 7 0 0 1 14 0c0 3-2 6-7 12z" fill="#d9480f"/><circle cx="378" cy="74" r="2.5" fill="#fff"/></g></g>
<circle cx="29" cy="37" r="4" fill="#d9480f"/>
<text x="40" y="41" class="s">HECHO PARA ASPROVEL</text>
