<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-label="Observatorio Agropecuario: Mapa, indicadores y datos abiertos de más de 5.500 productores en 69 municipios.">
<style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.t{fill:#fff;font-size:21px;font-weight:700}.s{fill:#8bb4e0;font-size:12px;font-weight:600;letter-spacing:1.5px}.d{fill:#c9d7e6;font-size:13.5px}.tag{fill:#a5c8f0;font-size:12px;font-weight:600}
.vivo{transform-box:fill-box;transform-origin:center;animation:late 1.6s ease-out infinite}@keyframes late{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.borde{animation:corre 3.5s linear infinite}@keyframes corre{from{transform:translateX(-160px)}to{transform:translateX(420px)}}
.esc{animation:flota 3s ease-in-out infinite alternate}@keyframes flota{to{transform:translateY(-5px)}}
.sello{transform-box:fill-box;transform-origin:center;animation:sello 2.4s ease-out infinite}@keyframes sello{0%,30%{transform:scale(0)}45%{transform:scale(1.2)}55%,100%{transform:scale(1)}}
.escaner{animation:scan 2s ease-in-out infinite alternate}@keyframes scan{to{transform:translateY(50px)}}
.gota{animation:cae 1.1s linear infinite}.g2{animation-delay:-.4s}.g3{animation-delay:-.8s}@keyframes cae{from{transform:translateY(0);opacity:1}to{transform:translateY(18px);opacity:0}}
.pin{animation:salta 1.4s ease-in-out infinite}@keyframes salta{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a4a"/><stop offset="1" stop-color="#103458"/></linearGradient>
<linearGradient id="luz" x1="0" x2="1"><stop offset="0" stop-color="#d9480f" stop-opacity="0"/><stop offset=".5" stop-color="#d9480f"/><stop offset="1" stop-color="#d9480f" stop-opacity="0"/></linearGradient>
<clipPath id="marco"><rect width="420" height="230" rx="16"/></clipPath></defs>
<g clip-path="url(#marco)">
<rect width="420" height="230" fill="url(#fondo)"/>
<rect width="6" height="230" fill="#d9480f"/>
<rect class="borde" y="227" width="160" height="3" fill="url(#luz)"/>
<g class="esc"><path d="M326 36l20-8 20 8 20-8v44l-20 8-20-8-20 8z" fill="#2da44e" opacity=".35"/><path d="M346 28v44M366 36v44" stroke="#2da44e" stroke-width="1.5" opacity=".6"/>
<g class="pin"><path d="M356 52c-7-9-10-13-10-17a10 10 0 0 1 20 0c0 4-3 8-10 17z" fill="#d9480f"/><circle cx="356" cy="35" r="3.5" fill="#fff"/></g></g>
<text x="24" y="42" class="s">HECHO PARA ASPROVEL</text>
<text x="24" y="72" class="t">Observatorio Agropecuario</text>
<text x="24" y="106" class="d">Mapa, indicadores y datos abiertos de más de</text>
<text x="24" y="126" class="d">5.500 productores en 69 municipios.</text>
<rect x="24" y="160" width="64.4" height="24" rx="12" fill="#163a63"/><text x="56.2" y="176" text-anchor="middle" class="tag">Django</text><rect x="96.4" y="160" width="94" height="24" rx="12" fill="#163a63"/><text x="143.4" y="176" text-anchor="middle" class="tag">PostgreSQL</text><rect x="198.4" y="160" width="57" height="24" rx="12" fill="#163a63"/><text x="226.9" y="176" text-anchor="middle" class="tag">Redis</text>
<circle class="vivo" cx="28" cy="207" r="4" fill="#2da44e"/><circle cx="28" cy="207" r="4" fill="#2da44e"/>
<text x="40" y="211" style="fill:#c9d7e6;font-size:12px;font-weight:600">En línea</text>
</g>
</svg>
